<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fynbos Five — print QRs</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        max-width: 52rem;
        background: #f4ead4;
        color: #1a160f;
      }
      .print-wrap {
        padding: 1.25rem;
      }
      .print-wrap h1 {
        color: #1e3318;
      }
      .note {
        max-width: 40rem;
        line-height: 1.45;
      }
      .stations {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr));
        gap: 1rem;
        margin-top: 1.25rem;
      }
      .station {
        background: #fff;
        border: 2px solid #3d5c32;
        border-radius: 1rem;
        padding: 1rem;
        text-align: center;
        break-inside: avoid;
      }
      .station img {
        width: 12rem;
        height: 12rem;
        background: #fff;
      }
      .station .url {
        font-family: system-ui, sans-serif;
        font-size: 0.7rem;
        word-break: break-all;
        color: #5c5346;
      }
      .home-link {
        display: inline-block;
        margin-bottom: 0.75rem;
        color: #3d5c32;
      }
      @media print {
        .no-print {
          display: none !important;
        }
        body {
          background: #fff;
          max-width: none;
        }
        .station {
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="print-wrap">
      <a class="home-link no-print" href="index.html">← Back to the game</a>
      <h1>Garden station QRs</h1>
      <p class="note">
        Print this page and put one sheet (or cut-out) at each plant. Phones should
        use the Camera app — not an in-app scanner. Codes are built from
        <strong>this page’s address</strong>, so open it on GitHub Pages before you
        print. Find order does not matter.
      </p>
      <p class="note no-print" id="base-note"></p>
      <div class="stations" id="stations"></div>
    </div>
    <script src="content.js"></script>
    <script>
      (function () {
        var base = new URL("index.html", window.location.href).href.split("#")[0];
        document.getElementById("base-note").textContent = "QR target: " + base;
        var root = document.getElementById("stations");
        window.CONTENT.insects.forEach(function (insect) {
          var url = base + "#catch/" + insect.id;
          var card = document.createElement("article");
          card.className = "station";
          var qr =
            "https://api.qrserver.com/v1/create-qr-code/?size=240x240&ecc=M&data=" +
            encodeURIComponent(url);
          card.innerHTML =
            "<p class=\"kicker\" style=\"color:#3d5c32\">" +
            insect.guild +
            "</p><h2 style=\"font-size:1.15rem;margin:0.3rem 0 0.6rem\">" +
            insect.commonName +
            "</h2><img alt=\"QR for " +
            insect.commonName +
            '" src="' +
            qr +
            '">';
          root.appendChild(card);
        });
      })();
    </script>
  </body>
</html>
