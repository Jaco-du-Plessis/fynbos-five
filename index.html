<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#32300C" />
    <title>Fynbos Five</title>
    <link rel="stylesheet" href="styles.css?v=15" />
  </head>
  <body>
    <main id="board" class="board">
      <header class="board-header">
        <p class="kicker">Stellenbosch Botanical Garden</p>
        <h1 id="title">Fynbos Five</h1>
        <p id="tagline" class="tagline"></p>
      </header>

      <section class="guilds" id="guilds" aria-label="Your ecosystem team"></section>

      <div class="board-actions">
        <button type="button" id="catch-bee" class="btn btn-primary"></button>
        <button type="button" id="reset" class="btn btn-ghost"></button>
      </div>
    </main>

    <section id="capture" class="overlay capture" hidden>
      <button type="button" id="capture-back" class="btn btn-chip" aria-label="Back to team">←</button>
      <p id="capture-guild" class="capture-guild"></p>
      <h2 id="capture-name" class="capture-name"></h2>
      <p id="capture-sci" class="capture-sci"></p>
      <div class="catch-stage">
        <img id="capture-insect" class="insect" alt="" draggable="false" />
        <img id="placed-bait" class="placed-bait" alt="" draggable="false" hidden />
      </div>
      <p id="bait-status" class="bait-status" aria-live="polite"></p>
      <p id="capture-hint" class="capture-hint"></p>
      <div id="bait-picker" class="bait-picker" role="listbox" aria-label="Bait"></div>
      <button type="button" id="place-bait" class="btn btn-primary" disabled></button>
    </section>

    <section id="quiz" class="overlay modal-overlay" hidden>
      <div class="card">
        <p class="card-kicker">Quick quiz</p>
        <h2 id="quiz-question"></h2>
        <div id="quiz-options" class="options"></div>
        <p id="quiz-feedback" class="quiz-feedback" aria-live="polite"></p>
      </div>
    </section>

    <section id="facts" class="overlay modal-overlay" hidden>
      <div class="card">
        <p id="facts-guild" class="card-kicker"></p>
        <h2 id="facts-name"></h2>
        <p id="facts-sci" class="capture-sci"></p>
        <img id="facts-image" class="facts-image" alt="" />
        <p id="facts-body" class="facts-body"></p>
        <button type="button" id="facts-close" class="btn btn-primary">Close</button>
      </div>
    </section>

    <section id="message" class="overlay modal-overlay" hidden>
      <div class="card">
        <h2 id="message-title"></h2>
        <p id="message-body"></p>
        <button type="button" id="message-dismiss" class="btn btn-primary"></button>
      </div>
    </section>

    <script src="content.js?v=12"></script>
    <script src="app.js?v=12"></script>
  </body>
</html>
